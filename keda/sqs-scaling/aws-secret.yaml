apiVersion: v1
kind: Secret
metadata:
  name: aws-secret
  namespace: default
type: Opaque
data:
  # Replace these with your base64 encoded AWS credentials
  # To encode: echo -n "your-key" | base64
  AWS_ACCESS_KEY_ID: <base64 encoded AWS_ACCESS_KEY_ID>
  AWS_SECRET_ACCESS_KEY: <base64 encoded AWS_SECRET_ACCESS_KEY>
  AWS_REGION: <base64 encoded AWS_REGION>
