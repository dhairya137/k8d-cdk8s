apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-deployment
  namespace: default
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: dhairya13703/nats-producer:latest
          env:
            - name: NATS_SERVER
              value: "nats://nats-jetstream:4222"
            - name: COUNT
              value: "5"
