apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: aws-sqs-queue-scaledobject
  namespace: keda
spec:
  scaleTargetRef:
    name: nginx-deployment
  minReplicaCount: 0 # We don't want pods if the queue is empty
  maxReplicaCount: 5 # We don't want more than 2 replicas
  pollingInterval: 10 # Frequency for metrics (in seconds)
  cooldownPeriod: 25 # Wait time for downscale (in seconds)
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-aws-credentials
      metadata:
        queueURL: https://sqs.us-east-1.amazonaws.com/571653956102/keda-test
        queueLength: "1"
        awsRegion: "us-east-1"
        identityOwner: operator
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-credentials
  namespace: keda
spec:
  podIdentity:
    provider: aws-eks
